[project]
name = "insurance-voicebot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain[google-genai]>=1.3.10",
    "langchain-community>=0.4.2",
    "chromadb>=1.5.9",
    "pypdf>=6.13.3",
    "langchain-pdf>=0.2.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-chroma>=1.1.0",
    "python-dotenv>=1.2.2",
    "faster-whisper>=1.2.1",
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "fastembed>=0.8.1",
]

[dependency-groups]
# Only the ingestion job (backend/rag/ingest_job.py) needs Docling, which pulls
# in torch -- keep it out of the web image. `uv sync --group ingest` to add it.
ingest = [
    "docling>=2.130.0",
]
