[project]
name = "insurance-voicebot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain[google-genai]>=1.3.10",
    "langchain-community>=0.4.2",
    "pypdf>=6.13.3",
    "langchain-pdf>=0.2.0",
    "langchain-text-splitters>=1.1.2",
    "python-dotenv>=1.2.2",
    "faster-whisper>=1.2.1",
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.32",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "fastembed>=0.8.1",
    "kokoro-onnx>=0.6.1",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "pgvector>=0.5.0",
    "google-cloud-storage>=3.16.0",
    "google-cloud-run>=0.10.0",
]

[dependency-groups]
# Only the ingestion job (backend/rag/ingest_job.py) needs Docling, which pulls
# in torch -- keep it out of the web image. `uv sync --group ingest` to add it.
ingest = [
    "docling>=2.130.0",
    # Listed directly so the [tool.uv.sources] below apply to them (uv only
    # applies sources to direct dependencies, not ones docling pulls in).
    "torch",
    "torchvision",
]

# On Linux (the Docker images, Cloud Run) use PyTorch's CPU-only wheels, which
# skips ~2 GB of CUDA libraries there is no GPU to use. macOS is unaffected.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
