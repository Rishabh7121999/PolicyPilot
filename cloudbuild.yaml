# Builds one image on Cloud Build's amd64 machines (Cloud Run only runs
# linux/amd64; an Apple Silicon laptop builds arm64) and pushes it.
#
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_DOCKERFILE=Dockerfile.web,_IMAGE=web,_TAG=$(git rev-parse --short HEAD) .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - ${_DOCKERFILE}
      - -t
      - asia-south1-docker.pkg.dev/${PROJECT_ID}/policypilot/${_IMAGE}:${_TAG}
      - .

images:
  - asia-south1-docker.pkg.dev/${PROJECT_ID}/policypilot/${_IMAGE}:${_TAG}

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
